<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="FinanceOS — Personal Finance Command Center" />
    <!-- La barra del navegador/PWA sigue al tema: en oscuro debe igualar --bg (#111210), no el verde de marca -->
    <meta name="theme-color" content="#1a6b4a" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111210" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FinanceOS" />
    <link rel="icon" type="image/png" href="/app/favicon.png" />
    <link rel="apple-touch-icon" href="/app/apple-touch-icon.png" />
    <title>FinanceOS</title>
    <!-- Fuentes autohospedadas (RGPD: antes iban a Google Fonts, transmitía
         la IP del visitante a Google). Carga NO bloqueante: preload + swap media=print. -->
    <link rel="preload" as="style" href="/fonts.css" />
    <link href="/fonts.css" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="/fonts.css" rel="stylesheet" /></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
